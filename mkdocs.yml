site_name: Junyoung IP Wiki
site_description: 개인 IP·특허 학습 Wiki
site_url: https://seok-junyoung.github.io/IP-Audit/

theme:
  name: material
  language: ko
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - 홈: index.md
  - 용어사전:
      - 명세서 기초:
          - 명세서의 구성과 역할: glossary/specification-basics.md
          - 명세서 주의 사항: glossary/specification-cautions.md
  - 세미나:
      - (출원)세미나 - 명세서에 대한 이해: seminar/patent-specification-understanding.md
  - 인터뷰:
      - 출원 담당자 인터뷰 가이드: interview/patent-prosecution-manager-interview-guide.md
      - 미래기술 출원그룹 리더 인터뷰 가이드: interview/future-tech-prosecution-leader-interview.md
      - 고등급 특허 다출원 엔지니어: interview/high-grade-patent-inventor-interview.md
      - 해외연구소/JEDEC 출원 담당자: interview/overseas-lab-jedec-prosecution-interview.md
      - 심의위원 경험자 인터뷰 가이드: interview/patent-grade-reviewer-interview-guide.md
  - 설문조사:
      - 출원 프로세스 설문조사 추진안: survey/prosecution-process-survey.md
  - 예상 현안:
      - 출원 프로세스 예상 현안: audit/expected-issues.md
      - 다른 시각의 현안 정리: audit/alternative-issue-hypotheses.md
      - 특허 등급체계 현안 및 대책: audit/patent-grade-improvement.md
      - 외부대리인 선정·배정: audit/external-counsel-allocation.md

plugins:
  - search:
      lang: ko

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
